services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wecom_ai}:${POSTGRES_PASSWORD:-wecom_ai}@postgres:5432/${POSTGRES_DB:-wecom_ai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wecom_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wecom_ai}
      POSTGRES_DB: ${POSTGRES_DB:-wecom_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
