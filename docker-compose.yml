services:
  app:
    image: ${APP_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service:latest}
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-wecom_ai}:${MYSQL_PASSWORD:-CHANGE_ME_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wecom_ai}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src"]
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service:latest}
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-wecom_ai}:${MYSQL_PASSWORD:-CHANGE_ME_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wecom_ai}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wecom_ai}
      MYSQL_USER: ${MYSQL_USER:-wecom_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Redis 在 Phase 1 生产 compose 中预留，但当前应用代码尚未消费，后续用于缓存/TTL/队列。
    restart: unless-stopped

volumes:
  mysql_data:
