services:
  app:
    image: ${APP_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service:latest}
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src"]
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service:latest}
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wecom_ai}
      MYSQL_USER: ${MYSQL_USER:-wecom_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Redis 在 Phase 1 生产 compose 中预留，但当前应用代码尚未消费，后续用于缓存/TTL/队列。
    restart: unless-stopped

  workpro-bridge:
    image: node:20-alpine
    profiles: ["workpro"]
    working_dir: /workspace/workpro-bridge
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WECHATY_PUPPET_SERVICE_AUTHORITY: ${WECHATY_PUPPET_SERVICE_AUTHORITY:-token-service-discovery-test.juzibot.com}
      WORKPRO_AUTO_ACCEPT_FRIENDSHIP: ${WORKPRO_AUTO_ACCEPT_FRIENDSHIP:-false}
      WORKPRO_BRIDGE_API_BASE_URL: ${WORKPRO_BRIDGE_API_BASE_URL:-http://app:8000}
      WORKPRO_BRIDGE_API_ENDPOINT: ${WORKPRO_BRIDGE_API_ENDPOINT:-/chat/messages}
      WORKPRO_BRIDGE_HTTP_TIMEOUT_MS: ${WORKPRO_BRIDGE_HTTP_TIMEOUT_MS:-10000}
    command: sh -c "npm install --no-fund --no-audit && npm run start"
    volumes:
      - ./:/workspace
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
