services:
  app:
    image: ${APP_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service:latest}
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src"]
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service:latest}
    build:
      context: .
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Asia/Shanghai}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wecom_ai}
      MYSQL_USER: ${MYSQL_USER:-wecom_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Redis 在 Phase 1 生产 compose 中预留，但当前应用代码尚未消费，后续用于缓存/TTL/队列。
    restart: unless-stopped

  wechaty-bridge:
    profiles: ["workpro"]
    image: ${BRIDGE_IMAGE:-ghcr.io/wenyh97/wecom-ai-customer-service-bridge:latest}
    build:
      context: ./bridge
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      WECHATY_PUPPET_SERVICE_TOKEN: ${WECHATY_PUPPET_SERVICE_TOKEN:-}
      WECHATY_PUPPET_SERVICE_AUTHORITY: ${WECHATY_PUPPET_SERVICE_AUTHORITY:-token-service-discovery-test.juzibot.com}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-http://app:8000}
      AI_BRIDGE_TOKEN: ${AI_BRIDGE_TOKEN:-}
      BRIDGE_WEB_HOST: ${BRIDGE_WEB_HOST:-0.0.0.0}
      BRIDGE_WEB_PORT: ${BRIDGE_WEB_PORT:-18080}
      BRIDGE_WEB_TOKEN: ${BRIDGE_WEB_TOKEN:-}
      BRIDGE_WEB_SESSION_TTL_MS: ${BRIDGE_WEB_SESSION_TTL_MS:-43200000}
      BRIDGE_WEB_VERIFY_TIMEOUT_MS: ${BRIDGE_WEB_VERIFY_TIMEOUT_MS:-300000}
      BRIDGE_MESSAGE_TIMEOUT_MS: ${BRIDGE_MESSAGE_TIMEOUT_MS:-20000}
      BRIDGE_API_MAX_RETRIES: ${BRIDGE_API_MAX_RETRIES:-1}
      BRIDGE_REPLY_MAX_LENGTH: ${BRIDGE_REPLY_MAX_LENGTH:-500}
      BRIDGE_MAX_MESSAGE_AGE_SECONDS: ${BRIDGE_MAX_MESSAGE_AGE_SECONDS:-180}
      BRIDGE_CONTACT_WHITELIST: ${BRIDGE_CONTACT_WHITELIST:-}
      WORKPRO_AUTO_ACCEPT_FRIENDSHIP: ${WORKPRO_AUTO_ACCEPT_FRIENDSHIP:-false}
      WORKPRO_STAFF_USERID: ${WORKPRO_STAFF_USERID:-}
    ports:
      - "${BRIDGE_WEB_BIND_HOST:-127.0.0.1}:${BRIDGE_WEB_PORT:-18080}:${BRIDGE_WEB_PORT:-18080}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('node:http');
          const request = http.get({
            host: '127.0.0.1',
            port: Number(process.env.BRIDGE_WEB_PORT || '18080'),
            path: '/health',
            timeout: 4000,
          }, (response) => {
            response.resume();
            process.exit(response.statusCode === 200 ? 0 : 1);
          });
          request.on('error', () => process.exit(1));
          request.on('timeout', () => request.destroy(new Error('bridge healthcheck timeout')));
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    command: ["npm", "run", "start"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
