name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/wecom-ai-customer-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 服务器使用 SSH 密码登录：密码通过 SSHPASS 环境变量传给 sshpass -e，
      # 不写入命令行参数，也不打印到日志。
      # 临时方案：当前阶段关闭 host key 校验（StrictHostKeyChecking=no，
      # UserKnownHostsFile=/dev/null），因此不再需要 SERVER_KNOWN_HOSTS。
      # 这会带来中间人攻击风险，部署稳定后应恢复 StrictHostKeyChecking=yes
      # 并改用 SSH key + known_hosts。
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass

      - name: Upload compose manifest
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH'"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password -P "$SERVER_SSH_PORT" docker-compose.yml "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy over SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" /bin/sh -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'EOF'
          set -eu
          DEPLOY_PATH=$1
          IMAGE_REF=$2
          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          if [ ! -f .env ]; then
            echo "Missing required $DEPLOY_PATH/.env" >&2
            exit 1
          fi
          for required_var in MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD DATABASE_URL; do
            if ! grep -q "^${required_var}=" .env; then
              echo "Missing required ${required_var} entry in $DEPLOY_PATH/.env" >&2
              exit 1
            fi
          done
          tmp_env=$(mktemp .env.XXXXXX)
          trap 'rm -f "$tmp_env"' EXIT
          awk -v image="$IMAGE_REF" '
            BEGIN { updated = 0 }
            /^APP_IMAGE=/ { print "APP_IMAGE=" image; updated = 1; next }
            { print }
            END {
              if (!updated) {
                print "APP_IMAGE=" image
              }
            }
          ' .env > "$tmp_env"
          mv "$tmp_env" .env
          CURRENT_APP_ID=$(docker compose ps -q app || true)
          if [ -n "$CURRENT_APP_ID" ]; then
            docker inspect --format='{{.Config.Image}}' "$CURRENT_APP_ID" > .previous_app_image || true
          fi
          docker compose pull app migrate
          docker compose --profile ops run --rm migrate
          docker compose up -d app mysql redis
          APP_PORT_VALUE=$(awk -F= '/^APP_PORT=/{print substr($0, index($0, "=") + 1); found=1; exit} END { if (!found) print "8000" }' .env)
          sleep 10
          curl -fsS "http://127.0.0.1:$APP_PORT_VALUE/health"
          printf '%s\n' "$IMAGE_REF" > .current_app_image
          EOF
