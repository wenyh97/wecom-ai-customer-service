name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wecom_ai
          MYSQL_USER: wecom_ai
          MYSQL_PASSWORD: wecom_ai
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uwecom_ai -pwecom_ai --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+asyncmy://wecom_ai:wecom_ai@127.0.0.1:3306/wecom_ai?charset=utf8mb4
      MYSQL_TEST_DATABASE_URL: mysql+asyncmy://wecom_ai:wecom_ai@127.0.0.1:3306/wecom_ai?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import time
          import pymysql

          for _ in range(30):
              try:
                  conn = pymysql.connect(
                      host='127.0.0.1',
                      user='wecom_ai',
                      password='wecom_ai',
                      database='wecom_ai',
                      connect_timeout=2,
                  )
              except Exception:
                  time.sleep(2)
              else:
                  conn.close()
                  raise SystemExit(0)
          raise SystemExit(1)
          PY

      - name: Alembic upgrade on MySQL
        run: alembic upgrade head

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Compose config check
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config
          rm .env
